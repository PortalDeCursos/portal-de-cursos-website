name: publicar no github pages
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER_MODE: hash
          VITE_API_CURSOS_URL: ${{ vars.VITE_API_CURSOS_URL }}
          VITE_API_DISCIPLINAS_URL: ${{ vars.VITE_API_DISCIPLINAS_URL }}
          VITE_API_AUTENTICACAO: ${{ vars.VITE_API_AUTENTICACAO }}
      - name: Preparar rotas da área do professor
        run: |
          mkdir -p dist/login dist/professor/feed dist/professor/perfil
          cp dist/index.html dist/login/index.html
          cp dist/index.html dist/professor/feed/index.html
          cp dist/index.html dist/professor/perfil/index.html
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
